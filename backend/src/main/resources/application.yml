spring:
  application:
    name: sentri-backend
  cache:
    type: simple
  datasource:
    url: ${SENTRI_DATABASE_URL:jdbc:postgresql://localhost:5432/sentri}
    username: ${SENTRI_DATABASE_USERNAME:sentri}
    password: ${SENTRI_DATABASE_PASSWORD:sentri}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

sentri:
  myspace:
    graph:
      enabled: ${SENTRI_MYSPACE_GRAPH_ENABLED:false}
      uri: ${SENTRI_MYSPACE_GRAPH_URI:bolt://localhost:7687}
      username: ${SENTRI_MYSPACE_GRAPH_USERNAME:neo4j}
      password: ${SENTRI_MYSPACE_GRAPH_PASSWORD:sentri-graph}
      database: ${SENTRI_MYSPACE_GRAPH_DATABASE:neo4j}
      max-related-limit: ${SENTRI_MYSPACE_GRAPH_MAX_RELATED_LIMIT:12}
    vector:
      enabled: ${SENTRI_MYSPACE_VECTOR_ENABLED:true}
      dimension: ${SENTRI_MYSPACE_VECTOR_DIMENSION:384}
      max-search-limit: ${SENTRI_MYSPACE_VECTOR_MAX_SEARCH_LIMIT:20}
      distance-metric: ${SENTRI_MYSPACE_VECTOR_DISTANCE_METRIC:cosine}
  timetable:
    upload:
      storage-dir: ${SENTRI_TIMETABLE_UPLOAD_DIR:./data/timetable-uploads}
      max-file-size-bytes: ${SENTRI_TIMETABLE_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
