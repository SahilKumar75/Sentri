spring:
  application:
    name: sentri-backend
  cache:
    type: simple
  datasource:
    url: ${SENTRI_DATABASE_URL:jdbc:postgresql://localhost:5432/sentri}
    username: ${SENTRI_DATABASE_USERNAME:sentri}
    password: ${SENTRI_DATABASE_PASSWORD:sentri}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

sentri:
  timetable:
    upload:
      storage-dir: ${SENTRI_TIMETABLE_UPLOAD_DIR:./data/timetable-uploads}
